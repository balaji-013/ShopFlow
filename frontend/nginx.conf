server {
  listen 80;
  root /usr/share/nginx/html;

  # hashed JS/CSS bundles never change under the same name => cache for a year (cache busting by filename)
  location ~* \.(?:js|css|woff2?)$ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }

  # SPA fallback: any unknown path serves index.html and Angular's router takes over. index.html itself must NOT be cached.
  location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }

  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # real client IP (rate limiting, logs)
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /hubs/ {                         # SignalR / WebSockets need the Upgrade handshake forwarded
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }
}